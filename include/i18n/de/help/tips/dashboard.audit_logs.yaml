#
# This is popup help messages for the Admin Panel -> Dashboard  -> Audit Logs page
#
# Fields:
# title - Shown in bold at the top of the popover window
# content - The body of the help popover
# links - List of links shows below the content
#   title - Link title
#   href - href of link (links starting with / are translated to the
#       helpdesk installation path)
#
# The key names such as 'helpdesk_name' should not be translated as they
# must match the HTML #ids put into the page template.
#
---
audit_logs:
    title: Überwachungsprotokolle
    content: >
        Hier finden Sie alle Aktivitäten, die in das Überwachungsprotokoll geschrieben wurden, während das Plugin zur Überwachung aktiviert ist
    links:
      - title: Plugins konfigurieren
        href: /scp/plugins.php

date_span:
    title: Datumsbereich
    content: >
        Wählen Sie den Datumsbereich, den Sie in den <span
        class="doc-desc-title">Überwachungsprotokollen</span> anzeigen möchten.

type:
    title: Typ
    content: >
        Wählen Sie den Objekttyp aus, für den Überwachungseinträge angezeigt werden sollen..

events:
    title: Ereignisse
    content: >
        Ergebnisse auf ein bestimmtes Ereignis eingrenzen.
