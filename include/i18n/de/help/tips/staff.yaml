#This is popup help messages for the Admin Panel -> Staff
#Fields:
#title - Shown in bold at the top of the popover window
#content - The body of the help popover
#The key names such as 'helpdesk_name' should not be translated as they
#must match the HTML #ids put into the page template.
---
signature:
  title: Signatur des Agentens
  content: |
    Hier können Sie eine Signatur für diesen Agenten erstellen, die beim Beantworten von Tickets optional ausgewählt werden kann. Diese Signatur erscheint nur in den ausgehenden E-Mails, jedoch nicht im Ticketverlauf selbst.
type:
  title: Kontotyp
  content: |
    <strong>Administratoren</strong> dürfen auf das Adminportal. zugreifen.<br> <strong>Agenten</srong> haben nur Zugang zum Agentenportal zum Verwalten Ihrer Tickets und der WissensDB.
group:
  title: Zugewiesene Gruppe
  content: |
    Die Gruppenzugehörigkeit legt fest, welche Rechte die Agenten im System haben. Gehen Sie zu den Gruppeneinstellungen, um festzulegen welche Berechtigungen diese Agenten im Helpdesk erhalten sollen.
notes:
  title: Interne Notizen
  content: |
    Geben Sie interne Notizen für die Agenten ein; diese Notizen sind jedoch nur für Agenten mit einem Administratorkonto sichtbar.
