export:
  title: Exportieren
  content: >
    Exportieren Sie die aktuelle Ansicht als CSV-Datei. CSV-Dateien können mit jeder Tabellenkalkulationssoftware (z.B. Microsoft Excel, Apple Pages, OpenOffice, usw.) geöffnet werden.

advanced_search_dialog:
  title: Erweiterte Suche
  content: >

adv_keyword:
  title: Stichwortsuche
  content: >
    Findet Tickets die das Stichwort im Betreff, den Mitteilungen des Tickes sowie innerhalb der benutzerdefinierten Textfelder, die mit diesem Ticket verknüpft sind.
adv_date_range:
  title: Suche nach Zeitraum
  content: >
    Findet Tickets, die im angegebenen Zeitraum erstellt wurden.
merge_types:
  title: Vorgehensweise beim Zusammenführen
  content: >
    <b>Verlauf zusammenführen:</b>
      Verläufe aller Tickets werden chronologisch sortiert angezeigt.</br>
    <b>Separate Verläufe:</b>
      Verläufe der Tickets werden jeweils einzeln angezeigt. (Nach Ticket gruppiert)
child_status:
  title: Status des untergeordneten Tickets
  content: >
    Alle untergeordneten Tickets werden geschlossen, da alle Verlaufseinträge in das übergeordnete Ticket verschoben werden.
parent_status:
  title: Status des übergeordneten Tickets
  content: >
    Wenn Sie einen übergeordneten Status festlegen, wird das übergeordnete Ticket in den von Ihnen ausgewählten Status geändert. Das oberste Ticket in der Liste ist das übergeordnete Ticket.
reply_types:
  title: Antwortmöglichkeiten
  content: >
    <b>Allen Antworten:</b>
      Diese Antwort wird an den Kunden und die von Ihnen ausgewählten beteiligten Personen gesendet.</br>
    <b>Dem Kunden antworten:</b>
      Diese Antwort wird nur dem Kunden gesendet, nicht an beteiligte Personen.</br>
    <b>Antwort nicht per E-Mail versenden:</b>
      Es werden keine E-Mail-Benachrichtigungen versendet, die Antwort des Agenten ist jedoch für <b>JEDEN<b> sichtbar, der das Ticket einsehen kann.
