#helpdesk installation path)
#The key names such as 'helpdesk_name' should not be translated as they
#must match the HTML #ids put into the page template.
---
search_field:
  title: Suchfeld
  content: >

advanced:
  title: Erweiterte Suche
  content: >
    Grenzen Sie Ihre Suchparameter ein. Wenn Sie Ihre erweiterten Suchkriterien ausgewählt und die Suche ausgeführt haben, können Sie die Ergebnisse am Ende der Ticketübersichtsseite <span class="doc-desc-title">exportieren</span>.
open_tickets_table:
  title: Offene Tickets
  content: >
    Alle offenen Tickets, die Ihre Aufmerksamkeit erfordern.
