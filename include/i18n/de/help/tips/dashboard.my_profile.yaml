  title: Kontaktinformationen
  content: >

username:
  title: Benutzername
  content: >
    Ausschließlich Agenten mit Administratorrechten können einen Benutzernamen ändern. Wenn Sie ein Agenten mit Administratorrechten sind, können Sie diese Änderung durchrühren, indem Sie den zu bearbeitenden Agenten aus dem <span class="doc-desc-title">Agentenverzeichnis</span> auswählen.
  links:
    - 
      title: Benutzernamen als Administrator ändern
      href: /scp/staff.php
config2fa:
  title: Zwei-Faktor-Authentifizierung
  content: >
    Die Zwei-Faktor-Authentifizierung bietet eine zusätzliche Sicherheitsebene, wenn Sie sich am Helpdesk anmelden. Sobald Sie Ihren Benutzernamen und Ihr Passwort korrekt übermittelt haben, müssen Sie ein Token eingeben, um die Anmeldung am Helpdesk abzuschließen.
