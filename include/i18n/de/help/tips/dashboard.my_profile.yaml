signature:
  title: Signatur
  content: >
    Erstellen Sie eine optionale <span class="doc-desc-title">Signatur</span>, die möglicherweise am Ende Ihrer Ticketantworten erscheint. Ob diese <span class="doc-desc-title">Signatur</span> erscheint, oder nicht, hängt von der <span class="doc-desc-title">E-Mail-Vorlage</span> ab, die für diese Ticketantwort verwendet wird.
  links:
    - 
      title: E-Mail-Vorlagen im Adminportal erstellen
      href: /scp/templates.php
# PlusAnpassung Anfang: backup assignment for vacation
backupAssignment:
  title: Urlaubsvertretung
  content: >
    Wenn der Urlaubsmodus für Sie aktiviert und eine Urlaubsvertretung hinterlegt ist,
    hinterlegt ist, werden folgende Aktionen umgeleitet:
    <ul>
        <li>Alle Tickets, die Ihnen zugewiesen werden, werden automatisch
        Ihrer Urlaubsvertretung zugewiesen</li>
        <li>Alle Benachrichtigungen zu Tickets, die Ihnen zugewiesen sind,
        werden zu Ihrer Urlaubsvertretung umgeleitet.<br>
        Das betrifft alle E-Mails bei neuen Mitteilungen und internen Aktivitäten.
        </li>
    </ul>
# PlusAnpassung Ende: backup assignment for vacation
